services:
  postgres:
    image: postgres:16-alpine
    container_name: vasundhara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vasundhara}
      POSTGRES_USER: ${POSTGRES_USER:-vasundhara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vasundhara_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vasundhara} -d ${POSTGRES_DB:-vasundhara}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vasundhara-net

  ai:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: vasundhara-ai
    restart: unless-stopped
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, os; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vasundhara-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vasundhara-api
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgresql://vasundhara:vasundhara_secret@postgres:5432/vasundhara?schema=public}
      JWT_SECRET: ${JWT_SECRET:-vasundhara_super_secret_jwt_key_prod_2026}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8000}
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 5000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - vasundhara-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: vasundhara-web
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vasundhara-net

volumes:
  postgres_data:
    driver: local

networks:
  vasundhara-net:
    driver: bridge
